# One-command way to run the whole stack containerized — this is the
# "how would you deploy this" answer: `docker compose up --build`.
#
# Local dev (npm run dev in server/ and client/, against the standalone
# `loyalty-postgres` container from the README) still works fine
# separately and is unaffected by this file.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdevpass
      POSTGRES_DB: loyalty
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Mapped to 5433 (not 5432) on the host to avoid clashing with the
      # separate `loyalty-postgres` container used for local `npm run dev`.
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Note: "postgres", not "localhost" — Docker's internal DNS
      # resolves service names to the right container on the compose
      # network, and containers don't share a network namespace with
      # each other or the host the way localhost would imply.
      DATABASE_URL: postgresql://postgres:localdevpass@postgres:5432/loyalty
      JWT_SECRET: change-this-to-a-real-secret-before-any-real-deploy
      JWT_EXPIRES_IN: 30m
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:5173
      NODE_ENV: production
      COOKIE_NAME: loyalty_token
    volumes:
      # Persists uploaded receipt files across container restarts/rebuilds.
      - server_uploads:/app/uploads
    ports:
      - '5000:5000'

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    depends_on:
      - server
    ports:
      - '5173:80'

volumes:
  postgres_data:
  server_uploads:
