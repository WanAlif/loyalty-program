server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxied straight to the server container over the compose network
    # (service name "server" resolves via Docker's internal DNS). Because
    # the browser only ever talks to this nginx origin, the httpOnly
    # session cookie is same-site here — no CORS involved.
    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cookie_path / /;
    }

    location /uploads/ {
        proxy_pass http://server:5000/uploads/;
    }

    # SPA fallback: any other path serves index.html so React Router's
    # client-side routes (e.g. a refresh on /login) don't 404 at nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
